name: 'Multi Git Mirror'
description: 'Mirror repositories to multiple Git hosting providers (GitLab, CodeCommit, Bitbucket, etc.)'
author: 'somaz94'

branding:
  icon: 'copy'
  color: 'blue'

inputs:
  targets:
    description: 'Mirror target URLs (newline-separated). Format: provider::url or just url'
    required: true
  gitlab_token:
    description: 'GitLab personal access token'
    required: false
    default: ''
  github_token:
    description: 'GitHub personal access token'
    required: false
    default: ''
  bitbucket_username:
    description: 'Bitbucket username for API token auth'
    required: false
    default: ''
  bitbucket_api_token:
    description: 'Bitbucket API token'
    required: false
    default: ''
  ssh_private_key:
    description: 'SSH private key for SSH-based authentication'
    required: false
    default: ''
  mirror_branches:
    description: 'Branches to mirror (comma-separated, or "all" for all branches)'
    required: false
    default: 'all'
  mirror_tags:
    description: 'Mirror tags (true/false)'
    required: false
    default: 'true'
  force_push:
    description: 'Use force push (true/false)'
    required: false
    default: 'true'
  dry_run:
    description: 'Dry run mode - log actions without pushing (true/false)'
    required: false
    default: 'false'
  retry_count:
    description: 'Number of retry attempts on push failure (0 = no retry)'
    required: false
    default: '0'
  retry_delay:
    description: 'Delay in seconds between retry attempts'
    required: false
    default: '5'
  exclude_branches:
    description: 'Branches to exclude from mirroring (comma-separated)'
    required: false
    default: ''
  parallel:
    description: 'Mirror to multiple targets in parallel (true/false)'
    required: false
    default: 'false'
  debug:
    description: 'Enable debug logging (true/false)'
    required: false
    default: 'false'

outputs:
  result:
    description: 'JSON object with mirror results per target'
  mirrored_count:
    description: 'Number of successfully mirrored targets'
  failed_count:
    description: 'Number of failed mirror targets'

runs:
  using: 'docker'
  # A prebuilt image rather than `Dockerfile`. With `Dockerfile`, every consumer
  # workflow builds this image before the action can start — measured at 31s per
  # run. Pulling costs a few seconds.
  #
  # The Dockerfile is still the source this image is built from, and ci.yml
  # keeps building it on every pull request, so the build path cannot rot.
  #
  # Two things this trades away, both deliberate:
  #   1. The tag must not be pushed before the image exists. release.yml
  #      publishes the image in a job the release job depends on, and the very
  #      first version is seeded by hand via its workflow_dispatch.
  #   2. `Dockerfile` built for whatever architecture the runner was; a registry
  #      reference resolves only to what was pushed. The image is published
  #      linux/amd64 + linux/arm64 so arm64 runners keep working.
  image: docker://ghcr.io/somaz94/multi-git-mirror:v1.2.0
  env:
    INPUT_TARGETS: ${{ inputs.targets }}
    INPUT_GITLAB_TOKEN: ${{ inputs.gitlab_token }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_BITBUCKET_USERNAME: ${{ inputs.bitbucket_username }}
    INPUT_BITBUCKET_API_TOKEN: ${{ inputs.bitbucket_api_token }}
    INPUT_SSH_PRIVATE_KEY: ${{ inputs.ssh_private_key }}
    INPUT_MIRROR_BRANCHES: ${{ inputs.mirror_branches }}
    INPUT_MIRROR_TAGS: ${{ inputs.mirror_tags }}
    INPUT_FORCE_PUSH: ${{ inputs.force_push }}
    INPUT_DRY_RUN: ${{ inputs.dry_run }}
    INPUT_RETRY_COUNT: ${{ inputs.retry_count }}
    INPUT_RETRY_DELAY: ${{ inputs.retry_delay }}
    INPUT_EXCLUDE_BRANCHES: ${{ inputs.exclude_branches }}
    INPUT_PARALLEL: ${{ inputs.parallel }}
    INPUT_DEBUG: ${{ inputs.debug }}
